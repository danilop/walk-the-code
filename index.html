<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>walk-the-code</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1 class="site-title" id="site-title">walk-the-code</h1>
  <p class="site-tagline" id="site-tagline"></p>
  <input class="search-input" id="search-input" type="text" placeholder="Filter labs..." autocomplete="off">
  <div id="content"></div>
</div>
<script src="site.js"></script>
<script>
async function loadData() {
  try {
    const [labsRes, chaptersRes, config] = await Promise.all([
      fetch("/api/labs"),
      fetch("/api/chapters").catch(() => null),
      window.WTCSite.loadConfig(),
    ]);
    if (labsRes.ok) {
      const labs = await labsRes.json();
      const chapters = chaptersRes && chaptersRes.ok ? await chaptersRes.json() : null;
      return {labs, chapters, config};
    }
  } catch(e) {}
  const r = await fetch("data/labs.json"), d = await r.json();
  return {labs: d.labs||d, chapters: d.chapters||null, config: d.config};
}
loadData().then(({labs, chapters, config}) => {
  window.WTCSite.renderGitHubCorner(config);
  document.getElementById("site-title").textContent = window.WTCSite.siteTitle(config);
  document.getElementById("site-tagline").textContent = config?.tagline || "";
  window.WTCSite.setDocumentTitle("", config);
  const el = document.getElementById("content");
  const labMap = {}; labs.forEach((l,i) => labMap[l.id] = {...l, idx:i});

  if (chapters && chapters.length) {
    chapters.forEach((ch, ci) => {
      const chLabs = ch.labs.map(id => labMap[id]).filter(Boolean);
      const div = document.createElement("div"); div.className = "chapter";
      div.innerHTML = `<div class="chapter-header${ci===0?" open":""}"><span class="chapter-num">Ch ${ci+1}</span><span class="chapter-title">${ch.title}</span><a class="chapter-link" href="chapter.html?chapter=${ch.id}" onclick="event.stopPropagation()">About →</a><span class="chapter-count">${chLabs.length} lab${chLabs.length!==1?"s":""}</span><span class="chapter-arrow">▶</span></div><ul class="chapter-labs${ci===0?" open":""}"></ul>`;
      const ul = div.querySelector("ul");
      chLabs.forEach(l => { ul.innerHTML += `<li class="lab-item"><a href="lab.html?lab=${l.id}"><span class="lab-num">${String(l.idx+1).padStart(2,"0")}</span><div><div class="lab-title-text">${l.title}</div><div class="lab-tagline">${l.tagline||""}</div></div></a></li>`; });
      div.querySelector(".chapter-header").onclick = function() { this.classList.toggle("open"); ul.classList.toggle("open"); };
      el.appendChild(div);
    });
  } else {
    const ul = document.createElement("ul"); ul.className = "lab-list";
    labs.forEach((l,i) => { ul.innerHTML += `<li class="lab-item"><a href="lab.html?lab=${l.id}"><span class="lab-num">${String(i+1).padStart(2,"0")}</span><div><div class="lab-title-text">${l.title}</div><div class="lab-tagline">${l.tagline||""}</div></div></a></li>`; });
    el.appendChild(ul);
  }
  document.getElementById("search-input").addEventListener("input", e => {
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll(".lab-item").forEach(li => {
      const text = li.textContent.toLowerCase();
      li.style.display = !q || text.includes(q) ? "" : "none";
    });
    document.querySelectorAll(".chapter").forEach(ch => {
      const visible = ch.querySelectorAll(".lab-item:not([style*='display: none'])").length;
      ch.style.display = !q || visible > 0 ? "" : "none";
      if (q && visible > 0) { ch.querySelector(".chapter-header").classList.add("open"); ch.querySelector(".chapter-labs").classList.add("open"); }
    });
  });
});
</script>
</body>
</html>
