[project]
name = "walk-the-code"
version = "0.1.0"
description = "Interactive line-by-line code tutorial viewer with multi-language support and Mermaid diagrams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
generate = ["anthropic>=0.40"]

[project.scripts]
walk-the-code = "walk_the_code.cli:serve"
wtc-serve = "walk_the_code.cli:serve"
wtc-build = "walk_the_code.cli:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/walk_the_code"]

[tool.hatch.build.targets.wheel.force-include]
"index.html" = "walk_the_code/assets/index.html"
"lab.html" = "walk_the_code/assets/lab.html"
"chapter.html" = "walk_the_code/assets/chapter.html"
"style.css" = "walk_the_code/assets/style.css"
"lab.js" = "walk_the_code/assets/lab.js"
"terminal.js" = "walk_the_code/assets/terminal.js"
"chapter.js" = "walk_the_code/assets/chapter.js"
