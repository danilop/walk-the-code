<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit — walk-the-code</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/c.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
<style>body{height:100vh;display:flex;flex-direction:column}</style>
</head>
<body>
<div class="unit-header">
  <div class="unit-header-top">
    <a href="/" class="back-link" id="back-link">&larr; Home</a>
    <h1 id="unit-title"></h1>
    <button class="edit-btn" id="edit-btn"><span class="icon">&#9998;</span> Edit</button>
    <button class="reset-btn" id="reset-btn"><span class="icon">&#8634;</span> Reset</button>
    <button class="play-btn" id="play-btn"><span class="icon">&#9654;</span> Run</button>
    <button class="stop-btn" id="stop-btn"><span class="icon">&#9632;</span> Stop</button>
    <span class="run-hint" id="run-hint" title="Install locally to run units: uv tool install walk-the-code">Clone repo to run</span>
  </div>
  <div class="tagline" id="unit-tagline" style="color:var(--text-muted);font-size:.85rem;margin-top:6px"></div>
  <div class="progress-bar" id="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div class="gutter-legend" id="gutter-legend">
    <span class="progress-text" id="progress-text"></span>
    <span class="gutter-legend-item"><span class="gutter-legend-dot dot-annotation"></span> explained</span>
    <span class="gutter-legend-item"><span class="gutter-legend-dot dot-important"></span> key concept</span>
    <span class="gutter-legend-item"><span class="gutter-legend-dot dot-diagram"></span> has diagram</span>
  </div>
</div>
<div class="unit-main">
  <div class="code-panel" id="code-panel">
    <div class="code-coach hidden" id="code-coach" role="status" aria-live="polite">
      <div class="code-coach-copy">
        <div class="code-coach-title">Click any line to inspect it</div>
        <div class="code-coach-text">Use ↑/↓ to jump between annotated lines.</div>
        <div class="gutter-legend">
          <span class="gutter-legend-item"><span class="gutter-legend-dot dot-annotation"></span> explained</span>
          <span class="gutter-legend-item"><span class="gutter-legend-dot dot-important"></span> key concept</span>
          <span class="gutter-legend-item"><span class="gutter-legend-dot dot-diagram"></span> has diagram</span>
        </div>
      </div>
      <button class="code-coach-close" id="code-coach-close" aria-label="Dismiss interaction hint">&times;</button>
    </div>
    <table class="code-table" id="code-table"></table>
  </div>
  <div class="h-resize" id="h-resize"></div>
  <button class="explain-toggle" id="explain-toggle">Explanation</button>
  <div class="explain-panel" id="explain-panel">
    <div class="explain-search">
      <input type="text" class="search-input" id="explain-search" placeholder="Search explanations..." autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
    <div id="explain-overview"></div>
    <div id="explain-line" style="display:none">
      <div class="explain-line-ref">
        <span id="explain-ref"></span>
        <button class="tips-btn" id="tips-btn" title="Show interaction tips" aria-label="Show interaction tips">Tips</button>
        <div class="line-nav hidden" id="line-nav">
          <button class="line-nav-btn" id="prev-line-btn" title="Previous annotated line (↑ / k)" aria-label="Previous annotated line">↑</button>
          <button class="line-nav-btn" id="next-line-btn" title="Next annotated line (↓ / j)" aria-label="Next annotated line">↓</button>
          <span class="line-nav-hint">annotated lines</span>
        </div>
        <button class="overview-btn" id="overview-btn">← Overview</button>
      </div>
      <div class="explain-text" id="explain-text"></div>
      <div class="diagram-container hidden" id="diagram-container"></div>
    </div>
    <div class="nav-footer" id="nav-footer"></div>
  </div>
</div>
<div class="terminal-panel" id="terminal-panel">
  <div class="terminal-resize-handle" id="terminal-resize-handle"></div>
  <div class="terminal-header">
    <span class="terminal-title"><span>Terminal</span><span class="terminal-status" id="terminal-status"></span></span>
    <button class="terminal-close" id="terminal-maximize" title="Toggle fullscreen">&#x26F6;</button>
    <button class="terminal-close" id="terminal-close" title="Stop and close">&times;</button>
  </div>
  <div class="terminal-output" id="terminal-output"></div>
</div>
<script src="site.js"></script>
<script type="module" src="unit.js"></script>
</body>
</html>
