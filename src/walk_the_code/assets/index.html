<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>walk-the-code</title>
<style>
  :root { --bg:#0d1117; --surface:#161b22; --border:#30363d; --text:#e6edf3; --text-muted:#8b949e; --accent:#58a6ff; --accent-dim:#1f6feb33; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  .container { max-width:860px; margin:0 auto; padding:60px 24px; }
  h1 { font-size:2.4rem; font-weight:700; letter-spacing:-0.03em; margin-bottom:8px; }
  .tagline { font-size:1.15rem; color:var(--text-muted); margin-bottom:48px; max-width:600px; }
  .lab-list { list-style:none; }
  .lab-item { border:1px solid var(--border); border-radius:8px; margin-bottom:8px; transition:border-color .15s,background .15s; }
  .lab-item:hover { border-color:var(--accent); background:var(--accent-dim); }
  .lab-item a { display:flex; align-items:flex-start; gap:16px; padding:16px 20px; text-decoration:none; color:inherit; }
  .lab-num { font-size:.85rem; font-weight:600; color:var(--text-muted); font-variant-numeric:tabular-nums; min-width:28px; padding-top:2px; }
  .lab-title { font-size:1.05rem; font-weight:600; color:var(--accent); }
  .lab-tagline { font-size:.88rem; color:var(--text-muted); margin-top:4px; line-height:1.45; }
</style>
</head>
<body>
<div class="container">
  <h1 id="site-title">walk-the-code</h1>
  <p class="tagline" id="site-tagline"></p>
  <ul class="lab-list" id="labs"></ul>
</div>
<script>
async function loadLabs() {
  try { const r = await fetch("/api/labs"); if (r.ok) return {labs: await r.json(), server: true}; } catch(e) {}
  const r = await fetch("data/labs.json");
  const d = await r.json();
  return {labs: d.labs || d.map(l => ({id:l.id, title:l.title, tagline:l.tagline})), config: d.config, server: false};
}
loadLabs().then(({labs, config, server}) => {
  if (config) {
    document.getElementById("site-title").textContent = config.title || "walk-the-code";
    document.getElementById("site-tagline").textContent = config.tagline || "";
  }
  const ul = document.getElementById("labs");
  labs.forEach((lab, i) => {
    const li = document.createElement("li");
    li.className = "lab-item";
    const num = String(i+1).padStart(2,"0");
    li.innerHTML = `<a href="lab.html?lab=${lab.id}"><span class="lab-num">${num}</span><div><div class="lab-title">${lab.title}</div><div class="lab-tagline">${lab.tagline||""}</div></div></a>`;
    ul.appendChild(li);
  });
});
</script>
</body>
</html>
