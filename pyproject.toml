[project]
name = "walk-the-code"
dynamic = ["version"]
description = "Interactive line-by-line code tutorial viewer with multi-language support and Mermaid diagrams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
walk-the-code = "walk_the_code.cli:serve"
wtc-serve = "walk_the_code.cli:serve"
wtc-build = "walk_the_code.cli:build"
wtc-init = "walk_the_code.cli:init"
wtc-validate = "walk_the_code.cli:validate"
wtc-hash = "walk_the_code.cli:hash"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Version comes from the commit date; see hatch_build.py.
[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/walk_the_code"]

[tool.hatch.build.targets.wheel.force-include]
"index.html" = "walk_the_code/assets/index.html"
"unit.html" = "walk_the_code/assets/unit.html"
"group.html" = "walk_the_code/assets/group.html"
"favicon.svg" = "walk_the_code/assets/favicon.svg"
"style.css" = "walk_the_code/assets/style.css"
"site.js" = "walk_the_code/assets/site.js"
"unit.js" = "walk_the_code/assets/unit.js"
"unit-state.js" = "walk_the_code/assets/unit-state.js"
"unit-data.js" = "walk_the_code/assets/unit-data.js"
"unit-edit.js" = "walk_the_code/assets/unit-edit.js"
"unit-render.js" = "walk_the_code/assets/unit-render.js"
"unit-tour.js" = "walk_the_code/assets/unit-tour.js"
"unit-search.js" = "walk_the_code/assets/unit-search.js"
"terminal.js" = "walk_the_code/assets/terminal.js"
"group.js" = "walk_the_code/assets/group.js"
"embed.html" = "walk_the_code/assets/embed.html"
"embed.js" = "walk_the_code/assets/embed.js"
